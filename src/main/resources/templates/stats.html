<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>統計ページ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/stats.css}">
</head>

<body>

    <div class="container">

        <header class="header">
            <div>
                <p class="page-label">STATISTICS</p>
                <h1>ルーティン達成状況</h1>
            </div>

            <a th:href="@{/}" class="home-link">ホームへ</a>
        </header>

        <section class="summary-grid">
            <div class="summary-card">
                <span>今週の達成率</span>
                <strong th:text="${weekAchievementRate + '%'}"></strong>
            </div>

            <div class="summary-card">
                <span>今月の達成率</span>
                <strong th:text="${monthAchievementRate + '%'}"></strong>
            </div>

            <div class="summary-card">
                <span>総完了回数</span>
                <strong th:text="${totalCompletedCount + '回'}"></strong>
            </div>
        </section>

        <section class="calendar-card">
            <div class="calendar-header">
                <h2>2026年6月</h2>

                <div class="calendar-legend">
                    <span><i class="legend none"></i>未達成</span>
                    <span><i class="legend low"></i>〜40%</span>
                    <span><i class="legend middle"></i>〜80%</span>
                    <span><i class="legend high"></i>80%以上</span>
                </div>
            </div>

            <div class="calendar-weekdays">
                <span>月</span>
                <span>火</span>
                <span>水</span>
                <span>木</span>
                <span>金</span>
                <span>土</span>
                <span>日</span>
            </div>

            <div class="calendar-grid">

                <button th:each="day : ${calendarDays}" th:text="${day.date.dayOfMonth}" th:data-date="${day.date}"
                    th:data-rate="${day.achievementRate}" th:classappend="
                    ${day.achievementRate == 0} ? 'calendar-day none' :
                    (${day.achievementRate <= 40} ? 'calendar-day low' :
                    (${day.achievementRate < 80} ? 'calendar-day middle' :
                    'calendar-day high'))
                ">
                </button>

            </div>
        </section>


    </div>

    <div class="modal-overlay" id="dailyDetailModal">
        <div class="modal-content daily-modal-content">

            <div class="modal-header">
                <div>
                    <p class="detail-date" id="selectedDateText">
                        2026年6月3日
                    </p>
                    <h2>この日のルーティン</h2>
                </div>

                <button class="modal-close" id="closeDailyDetailModal">
                    ×
                </button>
            </div>

            <strong class="daily-rate" id="selectedDailyRate">
                100%
            </strong>

            <div class="daily-routine-list" id="dailyRoutineList">
                <!-- JSで表示 -->
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/sidebar :: sidebar}">
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/stats.js}"></script>
</body>

</html>
