<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine Manager</title>

  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div class="app-container">

  <header class="header">
    <div>
      <p class="date" th:text="${today}">
        2026年5月31日（日）
      </p>

      <h1>今日のルーティン</h1>
    </div>

    <button class="add-button">
      ＋ ルーティン追加
    </button>
  </header>

  <section class="progress-card">

    <div class="progress-info">
      <span>今日の達成率</span>

      <strong id="progressText"
              th:text="${achievementRate + '%'}">
        0%
      </strong>
    </div>

    <div class="progress-bar">
      <div class="progress-fill"
           th:style="'width:' + ${achievementRate} + '%'">
      </div>
    </div>

    <p class="progress-count"
       th:text="${completedCount + ' / ' + totalCount + ' 件 完了'}">
      0 / 0 件 完了
    </p>

  </section>

  <main class="routine-list">

    <article class="routine-item"
             th:each="routine : ${routines}">

      <label>

        <input type="checkbox">

        <span class="checkmark"></span>

        <div>

          <h2 th:text="${routine.title}">
            ルーティン名
          </h2>

          <p th:text="${routine.description}">
            ルーティン説明
          </p>

        </div>

      </label>

    </article>

  </main>

</div>

<script th:src="@{/js/home.js}"></script>

</body>
</html>
