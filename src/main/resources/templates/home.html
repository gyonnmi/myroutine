<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routine</title>

  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

  <div class="container">

    <!-- ヘッダー -->
    <header class="header">
      <div>
        <p class="date" th:text="${today}">
          2026年5月31日（日）
        </p>

        <h1>
          <span th:text="${nickname} + 'さん、おはようございます '">
            キョンミさん、おはようございます
          </span>

          <span class="sun-icon">☀</span>
        </h1>
      </div>

      <button class="add-button" id="openRoutineModal">
        ＋ ルーティン追加
      </button>
    </header>

    <!-- 進捗カード -->
    <section class="progress-card">

      <div class="progress-info">
        <span class="progress-label">今日の達成率</span>

        <strong id="progressText" th:text="${achievementRate + '%'}">
        </strong>
      </div>

      <div class="progress-bar">
        <div class="progress-fill">
        </div>
      </div>

      <p class="progress-count" th:text="${completedCount + ' / ' + totalCount + ' 件 完了'}">
        0 / 0 件 完了
      </p>

    </section>

    <!-- ルーティンリスト -->
    <main class="routine-list">
      <article class="routine-item" th:each="routine : ${routines}"
        th:classappend="${completedRoutineIds.contains(routine.id)} ? 'completed'">

        <div class="routine-content">

          <!-- チェックボックス -->
          <label class="check-area">
            <input type="checkbox" class="routine-checkbox" th:data-id="${routine.id}"
              th:checked="${completedRoutineIds.contains(routine.id)}">

            <span class="checkmark"></span>
          </label>

          <!-- ルーティン情報 -->
          <div class="routine-info">
            <h2 class="routine-title" th:text="${routine.title}" th:data-id="${routine.id}"
              th:data-title="${routine.title}" th:data-description="${routine.description}"
              th:data-repeat-days="${routine.repeatDays}">
              ルーティン名
            </h2>

            <p th:text="${routine.description}">
              ルーティン説明
            </p>
          </div>
        </div>
        
        <!-- 繰り返し曜日 -->
        <div class="day-list">
          <span th:each="day : ${routine.dayList}" th:class="'day-badge day-' + ${day}" th:text="${day}">
          </span>
        </div>

      </article>
    </main>
  </div>

  <!-- ルーティン追加モーダル -->
  <div class="modal-overlay" id="routineModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">ルーティン追加</h2>
        <button class="modal-close" id="closeRoutineModal">×</button>
      </div>

      <!-- ルーティン追加フォーム -->
      <form th:action="@{/routines}" method="post" class="routine-form" id="routineForm">
        <input type="hidden" id="routineId" name="id">

        <div class="form-group">
          <label for="title">ルーティン名</label>
          <!-- <input type="text" id="title" name="title" placeholder="例：朝のストレッチ" required> -->
          <input type="text" id="title" name="title" placeholder="例：朝のストレッチ" required
            oninvalid="this.setCustomValidity('ルーティン名を入力してください。')" oninput="this.setCustomValidity('')">
        </div>

        <div class="form-group">
          <label for="description">説明</label>
          <textarea id="description" name="description" placeholder="例：10分間体を動かす"></textarea>
        </div>

        <div class="form-group">
          <label>繰り返し曜日</label>

          <div class="weekday-group">
            <label class="weekday">
              <input type="checkbox" name="repeatDays" value="MON">
              <span>月</span>
            </label>

            <label class="weekday">
              <input type="checkbox" name="repeatDays" value="TUE">
              <span>火</span>
            </label>

            <label class="weekday">
              <input type="checkbox" name="repeatDays" value="WED">
              <span>水</span>
            </label>

            <label class="weekday">
              <input type="checkbox" name="repeatDays" value="THU">
              <span>木</span>
            </label>

            <label class="weekday">
              <input type="checkbox" name="repeatDays" value="FRI">
              <span>金</span>
            </label>

            <label class="weekday">
              <input type="checkbox" name="repeatDays" value="SAT">
              <span>土</span>
            </label>

            <label class="weekday">
              <input type="checkbox" name="repeatDays" value="SUN">
              <span>日</span>
            </label>
          </div>
        </div>

        <!-- 繰り返し曜日バリデーション用 -->
        <input type="text" id="repeatDaysValidator" required tabindex="-1" class="repeat-days-validator">

        <!-- モーダル操作ボタン -->
        <div class="modal-actions">
          <button type="button" class="delete-button" id="deleteRoutineButton">
            削除する
          </button>

          <div class="right-actions">
            <button type="button" class="cancel-button" id="cancelRoutineModal">
              キャンセル
            </button>
            <button type="submit" class="submit-button" id="submitButton">
              追加する
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- サイドバー -->
  <div th:replace="~{fragments/sidebar :: sidebar}">
  </div>

  <!-- 토스트메세지 -->
  <div id="achievementToast" class="achievement-toast">
  </div>

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/home.js}"></script>

</body>

</html>
