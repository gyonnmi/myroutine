<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>マイページ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>

<body>

    <div class="container">

        <header class="header">
            <div>
                <p class="page-label">MY PAGE</p>
                <h1 th:text="${user.nickname} + 'さんのマイページ'">
                    マイページ
                </h1>
            </div>

            <a th:href="@{/}" class="home-link">ホームへ</a>
        </header>

        <section class="profile-card">
            <h2>ユーザー情報</h2>

            <p>
                <span>ユーザーID</span>
                <strong th:text="${user.username}">username</strong>
            </p>

            <p>
                <span>ニックネーム</span>
                <strong th:text="${user.nickname}">nickname</strong>
            </p>
        </section>

        <section class="form-card">
            <h2>ニックネーム変更</h2>

            <form th:action="@{/mypage/nickname}" method="post">
                <input type="text" name="nickname" placeholder="新しいニックネーム" required>
                <button type="submit">変更する</button>
            </form>
        </section>

        <section class="form-card">
            <h2>パスワード変更</h2>

            <form th:action="@{/mypage/password}" method="post">
                <input type="password" name="password" placeholder="新しいパスワード" required>
                <button type="submit">変更する</button>
            </form>
        </section>

        <section class="routine-card">
            <h2>登録したルーティン一覧</h2>

            <div class="routine-list">
                <div class="routine-row" th:each="routine : ${routines}">

                    <div class="routine-info">
                        <strong th:text="${routine.title}">ルーティン名</strong>
                        <p th:text="${routine.description}">説明</p>

                        <div class="mypage-weekdays">
                            <span th:classappend="${#strings.contains(routine.repeatDays, 'MON')} ? 'selected'">月</span>
                            <span th:classappend="${#strings.contains(routine.repeatDays, 'TUE')} ? 'selected'">火</span>
                            <span th:classappend="${#strings.contains(routine.repeatDays, 'WED')} ? 'selected'">水</span>
                            <span th:classappend="${#strings.contains(routine.repeatDays, 'THU')} ? 'selected'">木</span>
                            <span th:classappend="${#strings.contains(routine.repeatDays, 'FRI')} ? 'selected'">金</span>
                            <span th:classappend="${#strings.contains(routine.repeatDays, 'SAT')} ? 'selected'">土</span>
                            <span th:classappend="${#strings.contains(routine.repeatDays, 'SUN')} ? 'selected'">日</span>
                        </div>
                    </div>

                    <div class="routine-actions">
                        <button type="button" class="edit-routine-button" th:data-id="${routine.id}"
                            th:data-title="${routine.title}" th:data-description="${routine.description}"
                            th:data-repeat-days="${routine.repeatDays}">
                            ✏️
                        </button>

                        <form th:if="${routine.active}" th:action="@{/mypage/routines/{id}/delete(id=${routine.id})}"
                            method="post" onsubmit="return confirm('このルーティンを削除しますか？');">

                            <button type="submit" class="trash-button" title="削除">
                                🗑️
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </section>

        <section class="danger-card">
            <h2>会員退会</h2>
            <p>退会すると、登録情報が削除されます。</p>

            <form th:action="@{/mypage/delete}" method="post">
                <button type="submit" class="delete-button" onclick="return confirm('本当に退会しますか？');">
                    退会する
                </button>
            </form>
        </section>

    </div>

    <!-- ルーティン編集モーダル -->
    <div class="modal-overlay" id="editRoutineModal">
        <div class="modal-content">

            <div class="modal-header">
                <h2>ルーティン編集</h2>
                <button class="modal-close" id="closeEditRoutineModal">×</button>
            </div>

            <form method="post" class="routine-form" id="editRoutineForm">

                <div class="form-group">
                    <label>ルーティン名</label>
                    <input type="text" id="editTitle" name="title" required>
                </div>

                <div class="form-group">
                    <label>説明</label>
                    <textarea id="editDescription" name="description"></textarea>
                </div>

                <div class="form-group">
                    <label>繰り返し曜日</label>

                    <div class="weekday-group">
                        <label class="weekday">
                            <input type="checkbox" name="repeatDays" value="MON">
                            <span>月</span>
                        </label>

                        <label class="weekday">
                            <input type="checkbox" name="repeatDays" value="TUE">
                            <span>火</span>
                        </label>

                        <label class="weekday">
                            <input type="checkbox" name="repeatDays" value="WED">
                            <span>水</span>
                        </label>

                        <label class="weekday">
                            <input type="checkbox" name="repeatDays" value="THU">
                            <span>木</span>
                        </label>

                        <label class="weekday">
                            <input type="checkbox" name="repeatDays" value="FRI">
                            <span>金</span>
                        </label>

                        <label class="weekday">
                            <input type="checkbox" name="repeatDays" value="SAT">
                            <span>土</span>
                        </label>

                        <label class="weekday">
                            <input type="checkbox" name="repeatDays" value="SUN">
                            <span>日</span>
                        </label>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-button" id="cancelEditRoutineModal">
                        キャンセル
                    </button>

                    <button type="submit" class="submit-button">
                        更新する
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- サイドバー -->
    <div th:replace="~{fragments/sidebar :: sidebar}">
    </div>

    <div id="toast" class="toast" th:if="${param.toast}">

        <span th:if="${param.toast[0] == 'nickname'}">
            🌸 ニックネームが変更されました。
        </span>

        <span th:if="${param.toast[0] == 'password'}">
            🔒 パスワードが変更されました。
        </span>

    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/mypage.js}"></script>
</body>

</html>
