spring.application.name=myroutine

# MySQL 연결 정보 (3306 포트의 myroutine 스키마 연결)
spring.datasource.url=jdbc:mysql://localhost:3306/myroutine?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=000713
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate 설정 (엔티티 변경 시 테이블 자동 반영)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 타임리프 및 DevTools (실시간 화면 반영)
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true